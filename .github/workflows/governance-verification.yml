name: Governance Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: packages/deeprun-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all backend code
        run: npm run check

      - name: Typecheck governance surface
        run: npm run typecheck:governance

      - name: Run governance unit tests
        run: npm run test:governance

  governance-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deeprun_test
          POSTGRES_PASSWORD: deeprun_test
          POSTGRES_DB: deeprun_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U deeprun_test -d deeprun_governance_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: packages/deeprun-backend

    env:
      TEST_DATABASE_URL: postgres://deeprun_test:deeprun_test@localhost:5432/deeprun_governance_test
      ARTIFACTS_PATH: /tmp/governance-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Postgres governance integration tests
        run: npm run test:governance:integration:ci

  governance-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deeprun_test
          POSTGRES_PASSWORD: deeprun_test
          POSTGRES_DB: deeprun_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U deeprun_test -d deeprun_governance_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: packages/deeprun-backend

    env:
      DEEPRUN_GOVERNANCE_E2E_REQUIRE_DB: "true"
      TEST_DATABASE_URL: postgres://deeprun_test:deeprun_test@localhost:5432/deeprun_governance_test
      ARTIFACTS_PATH: /tmp/governance-e2e-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run governance E2E tests
        run: npm run test:governance:e2e:ci
